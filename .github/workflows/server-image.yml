name: Publish Budget Server Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image version (for example 0.9.0-beta.1)
        required: true
        type: string
  push:
    tags:
      - "server-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          value="${INPUT_VERSION:-${REF_NAME#server-v}}"
          [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || exit 2
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing release tag
        run: |
          if docker buildx imagetools inspect "ghcr.io/firepika2000/budget-server:${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing server image version" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/firepika2000/budget-server:${{ steps.version.outputs.value }}
            ghcr.io/firepika2000/budget-server:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
      - name: Build customer deployment bundle
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p release/clearpocket-server
          cp -R distribution/server/. release/clearpocket-server/
          printf '%s\n' "$VERSION" > release/clearpocket-server/VERSION
          sed -i "s/^CLEARPOCKET_SERVER_VERSION=.*/CLEARPOCKET_SERVER_VERSION=$VERSION/" release/clearpocket-server/.env.example
          (cd release && zip -r "clearpocket-server-$VERSION.zip" clearpocket-server)
          tar -C release -czf "release/clearpocket-server-$VERSION.tar.gz" clearpocket-server
      - uses: actions/upload-artifact@v4
        with:
          name: clearpocket-server-${{ steps.version.outputs.value }}
          path: |
            release/clearpocket-server-${{ steps.version.outputs.value }}.zip
            release/clearpocket-server-${{ steps.version.outputs.value }}.tar.gz
          if-no-files-found: error
