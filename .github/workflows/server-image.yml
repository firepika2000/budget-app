name: Publish Budget Server Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image version (for example 0.9.0-beta.1)
        required: true
        type: string
  push:
    tags:
      - "server-v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          value="${INPUT_VERSION:-${REF_NAME#server-v}}"
          [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || exit 2
          qnap="$value"
          if [[ "$value" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta|rc)\.?([0-9]+)$ ]]; then
            case "${BASH_REMATCH[2]}" in alpha) stage=a ;; beta) stage=b ;; rc) stage=r ;; esac
            qnap="${BASH_REMATCH[1]}${stage}${BASH_REMATCH[3]}"
          fi
          [[ "$qnap" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,9}$ ]] || {
            echo "Version cannot be represented safely in QNAP's ten-character package field" >&2
            exit 2
          }
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "qnap=$qnap" >> "$GITHUB_OUTPUT"
      - name: Resolve or reserve immutable image version
        id: existing_image
        run: |
          image="ghcr.io/firepika2000/budget-server:${{ steps.version.outputs.value }}"
          if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          metadata=$(docker buildx imagetools inspect "$image" \
            --format '{{json (index .Image "linux/amd64")}}')
          revision=$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<<"$metadata")
          [ "$revision" = "$GITHUB_SHA" ] || {
            echo "Refusing to overwrite an existing server image version from another commit" >&2
            exit 1
          }
          manifest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}')
          digest=$(jq -r '.digest // empty' <<<"$manifest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Existing same-commit image has no valid immutable digest" >&2
            exit 1
          }
          echo "Reusing the existing immutable image produced by this exact commit."
          echo "reuse=true" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: image
        if: steps.existing_image.outputs.reuse != 'true'
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/firepika2000/budget-server:${{ steps.version.outputs.value }}
            ghcr.io/firepika2000/budget-server:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
      - name: Build customer deployment bundle
        env:
          VERSION: ${{ steps.version.outputs.value }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest || steps.existing_image.outputs.digest }}
        run: |
          mkdir -p release/clearpocket-server
          cp -R distribution/server/. release/clearpocket-server/
          mkdir -p release/clearpocket-server/tools
          cp server/scripts/backup.sh server/scripts/restore.sh \
             server/scripts/backup_archive.py server/scripts/backup_destination.py \
             server/scripts/backup_schedule.py \
             server/scripts/require_empty_restore.sql release/clearpocket-server/tools/
          printf '%s\n' "$VERSION" > release/clearpocket-server/VERSION
          printf 'version=%s\ncommit=%s\nimage=ghcr.io/firepika2000/budget-server@%s\n' \
            "$VERSION" "$GITHUB_SHA" "$IMAGE_DIGEST" \
            > release/clearpocket-server/RELEASE-METADATA.txt
          sed -i "s/^CLEARPOCKET_SERVER_VERSION=.*/CLEARPOCKET_SERVER_VERSION=$VERSION/" release/clearpocket-server/.env.example
          (cd release/clearpocket-server && \
            find . -type f ! -name PACKAGE-CONTENTS-SHA256.txt -print0 | sort -z | \
            xargs -0 sha256sum > PACKAGE-CONTENTS-SHA256.txt)
          (cd release && zip -r "clearpocket-server-windows-$VERSION.zip" clearpocket-server)
          tar -C release -czf "release/clearpocket-server-docker-$VERSION.tar.gz" clearpocket-server
          (cd release && sha256sum \
            "clearpocket-server-windows-$VERSION.zip" \
            "clearpocket-server-docker-$VERSION.tar.gz" \
            > "clearpocket-server-$VERSION-SHA256SUMS.txt")
      - name: Build unsigned QNAP hardware-acceptance package
        id: qnap_package
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.value }}
          QPKG_VERSION: ${{ steps.version.outputs.qnap }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest || steps.existing_image.outputs.digest }}
        run: |
          git clone https://github.com/qnap-dev/QDK.git qdk
          git -C qdk checkout --detach 955d98c9913989561142f9a9ac994ec0091559d6
          sudo bash qdk/InstallToUbuntu.sh install
          rm -rf distribution/qnap/build
          CLEARPOCKET_QPKG_VERSION="$QPKG_VERSION" \
          CLEARPOCKET_SERVER_IMAGE_DIGEST="$IMAGE_DIGEST" \
          CLEARPOCKET_SOURCE_COMMIT="$GITHUB_SHA" \
            distribution/qnap/build.sh "$VERSION" /usr/share/QDK/bin/qbuild
          set -- distribution/qnap/build/*.qpkg
          [ "$#" -eq 1 ] || { echo "QDK did not produce exactly one QPKG" >&2; exit 1; }
          cp "$1" "release/clearpocket-server-qnap-unsigned-$VERSION.qpkg"
          (cd release && sha256sum "clearpocket-server-qnap-unsigned-$VERSION.qpkg" \
            > "clearpocket-server-qnap-unsigned-$VERSION-SHA256SUM.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: clearpocket-server-${{ steps.version.outputs.value }}
          path: |
            release/clearpocket-server-windows-${{ steps.version.outputs.value }}.zip
            release/clearpocket-server-docker-${{ steps.version.outputs.value }}.tar.gz
            release/clearpocket-server-${{ steps.version.outputs.value }}-SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.qnap_package.outcome == 'success'
        with:
          name: clearpocket-server-qnap-unsigned-${{ steps.version.outputs.value }}
          path: |
            release/clearpocket-server-qnap-unsigned-${{ steps.version.outputs.value }}.qpkg
            release/clearpocket-server-qnap-unsigned-${{ steps.version.outputs.value }}-SHA256SUM.txt
          if-no-files-found: error
      - name: Publish immutable customer downloads
        if: startsWith(github.ref, 'refs/tags/server-v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "ClearPocket Server $VERSION" \
            "release/clearpocket-server-windows-$VERSION.zip#Windows / Docker Desktop installer" \
            "release/clearpocket-server-docker-$VERSION.tar.gz#Docker Engine bundle" \
            "release/clearpocket-server-$VERSION-SHA256SUMS.txt#SHA-256 download checksums"
