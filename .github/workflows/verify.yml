name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: budget_test
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: test-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d budget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install -e '.[dev]'
        working-directory: server
      - run: pytest
        working-directory: server
      - run: python -m compileall -q app tests migrations
        working-directory: server
      - run: alembic upgrade head
        working-directory: server
        env:
          BUDGET_APP_DATABASE_URL: postgresql+psycopg://budget:test-database-password@127.0.0.1:5432/budget_test
          BUDGET_APP_JWT_SECRET: ci-only-secret-that-is-longer-than-32-characters
      - run: bash -n scripts/backup.sh scripts/restore.sh
        working-directory: server
      - run: docker build --tag budget-app-server:test .
        working-directory: server

  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - run: swift test
