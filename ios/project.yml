name: BudgetApp
options:
  bundleIdPrefix: com.firepika
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "17.0"
packages:
  BudgetCore:
    path: ..
targets:
  BudgetApp:
    type: application
    platform: iOS
    sources:
      - path: BudgetApp
    dependencies:
      - package: BudgetCore
        product: BudgetAPI
    postBuildScripts:
      - name: Inject Runtime Identity
        script: |
          REPOSITORY_ROOT="${SRCROOT}/.."
          RUNTIME_IDENTITY_PATH="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/BudgetAppRuntimeIdentity.txt"
          COMMIT_SHA="$(git -C "${REPOSITORY_ROOT}" rev-parse --short=12 HEAD 2>/dev/null || printf unknown)"
          mkdir -p "$(dirname "${RUNTIME_IDENTITY_PATH}")"
          printf 'commit=%s\nconfiguration=%s\n' "${COMMIT_SHA}" "${CONFIGURATION}" > "${RUNTIME_IDENTITY_PATH}"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.firepika.BudgetApp
        PRODUCT_NAME: Budget App
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Budget App
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Budget App connects to your self-hosted budget server on the local network.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
  BudgetAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BudgetAppTests
    dependencies:
      - target: BudgetApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.firepika.BudgetAppTests
        SWIFT_VERSION: "5.10"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Budget App.app/Budget App"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BudgetApp:
    build:
      targets:
        BudgetApp: all
        BudgetAppTests: [test]
    test:
      targets:
        - BudgetAppTests
