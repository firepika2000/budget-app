name: clearpocket-server

services:
  api:
    image: ${CLEARPOCKET_SERVER_IMAGE:-ghcr.io/firepika2000/budget-server}:${CLEARPOCKET_SERVER_VERSION:-edge}
    restart: unless-stopped
    environment:
      BUDGET_APP_DATABASE_URL: postgresql+psycopg://budget:${BUDGET_APP_DB_PASSWORD}@database:5432/budget
      BUDGET_APP_JWT_SECRET: ${BUDGET_APP_JWT_SECRET}
      BUDGET_APP_ALLOWED_HOSTS: ${BUDGET_APP_ALLOWED_HOSTS}
      BUDGET_APP_ATTACHMENT_STORAGE_PATH: /var/lib/budget-app/attachments
      BUDGET_APP_ATTACHMENT_ENCRYPTION_KEY: ${BUDGET_APP_ATTACHMENT_ENCRYPTION_KEY}
      BUDGET_APP_BACKUP_STATUS_PATH: /var/lib/budget-app/operations/backup-status.json
      BUDGET_APP_RECOVERY_STATUS_PATH: /var/lib/budget-app/operations/recovery-status.json
      BUDGET_APP_PAIRING_PUBLIC_URL: ${BUDGET_APP_PAIRING_PUBLIC_URL:-}
      BUDGET_APP_FORWARDED_ALLOW_IPS: ${BUDGET_APP_FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${CLEARPOCKET_BIND_ADDRESS:-127.0.0.1}:${CLEARPOCKET_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "${CLEARPOCKET_ATTACHMENTS_STORAGE:-clearpocket_attachments}:/var/lib/budget-app/attachments"
      - "${CLEARPOCKET_OPERATIONS_STORAGE:-clearpocket_operations}:/var/lib/budget-app/operations"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  proxy:
    image: ${CLEARPOCKET_CADDY_IMAGE:-caddy:2.11.4-alpine}
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      CLEARPOCKET_PUBLIC_HOST: ${CLEARPOCKET_PUBLIC_HOST:-invalid.localhost}
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - clearpocket_caddy_data:/data
      - clearpocket_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  qnap-proxy:
    image: ${CLEARPOCKET_CADDY_IMAGE:-caddy:2.11.4-alpine}
    profiles: ["qnap-tls"]
    restart: unless-stopped
    environment:
      CLEARPOCKET_PUBLIC_HOST: ${CLEARPOCKET_PUBLIC_HOST:-invalid.localhost}
    ports:
      - "127.0.0.1:${CLEARPOCKET_QNAP_PROXY_PORT:-8443}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777
      - /data:size=16M,mode=0700
      - /config:size=16M,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./Caddyfile.qnap:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: budget
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${BUDGET_APP_DB_PASSWORD}
    volumes:
      - "${CLEARPOCKET_DATABASE_STORAGE:-clearpocket_database}:/var/lib/postgresql/data"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  clearpocket_database:
  clearpocket_attachments:
  clearpocket_operations:
  clearpocket_caddy_data:
  clearpocket_caddy_config:
